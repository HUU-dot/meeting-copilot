<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会议助手</title>
<style>
  :root {
    --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --ink2:#6e6e73; --ink3:#a1a1a6; --hair:rgba(0,0,0,.08);
    --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
    --blue:#007aff; --indigo:#5856d6; --green:#34c759; --red:#ff3b30; --orange:#ff9500;
    --tintBlue:rgba(0,122,255,.1); --tintIndigo:rgba(88,86,214,.1); --tintOrange:rgba(255,149,0,.12);
    --bar:rgba(245,245,247,.72); --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --ink2:#98989d; --ink3:#636366; --hair:rgba(255,255,255,.1);
      --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
      --blue:#0a84ff; --indigo:#5e5ce6; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
      --tintBlue:rgba(10,132,255,.18); --tintIndigo:rgba(94,92,230,.2); --tintOrange:rgba(255,159,10,.16);
      --bar:rgba(28,28,30,.72); --shadow:none;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; scrollbar-gutter:stable; overflow-anchor:none; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif; letter-spacing:-.003em; }

  /* 工具栏 */
  header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px; padding:10px 16px;
           background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border-bottom:.5px solid var(--hair); }
  .status { display:flex; align-items:center; gap:8px; margin-right:auto; min-width:0; font-size:13px; color:var(--ink2); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--ink3); flex:none; }
  .dot.live { background:var(--red); box-shadow:0 0 0 0 rgba(255,59,48,.5); animation:ring 1.6s infinite; }
  .dot.load { background:var(--orange); animation:blink .9s infinite; }
  @keyframes ring { 70% { box-shadow:0 0 0 7px rgba(255,59,48,0); } 100% { box-shadow:0 0 0 0 rgba(255,59,48,0); } }
  @keyframes blink { 50% { opacity:.35; } }
  .warnText { color:var(--orange); }

  .seg { display:inline-flex; padding:2px; border-radius:9px; background:var(--fill); }
  .seg button { border:0; background:transparent; color:var(--ink); font:inherit; font-size:13px; padding:4px 12px; border-radius:7px; cursor:pointer; transition:background .15s; }
  .seg button.on { background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px var(--hair); font-weight:500; }
  .seg.disabled { opacity:.55; } .seg.disabled button { cursor:default; }

  .btn { border:0; font:inherit; font-size:13px; font-weight:500; padding:6px 14px; border-radius:980px; cursor:pointer; background:var(--fill); color:var(--ink); transition:filter .15s, opacity .15s, transform .05s; }
  .btn:hover:not(:disabled) { filter:brightness(.96); } .btn:active:not(:disabled) { transform:scale(.98); }
  .btn:disabled { opacity:.4; cursor:default; }
  .btn.blue { background:var(--blue); color:#fff; } .btn.red { background:var(--red); color:#fff; }
  .btn.tintBlue { background:var(--tintBlue); color:var(--blue); } .btn.tintIndigo { background:var(--tintIndigo); color:var(--indigo); }
  .btn.plain { background:transparent; color:var(--blue); padding:6px 8px; }
  .btn.big { font-size:15px; font-weight:600; padding:10px 16px; flex:1; }

  #warn { display:none; margin:12px 16px 0; padding:10px 14px; border-radius:12px; background:var(--tintOrange); color:var(--ink); font-size:13px; }
  #warn .btn { margin-left:8px; padding:2px 10px; font-size:12px; }

  /* 版面 */
  main { padding:14px 16px 36px; display:grid; gap:16px; grid-template-columns:minmax(0,1fr); max-width:1500px; margin:0 auto;
         align-content:start; /* 页面高度被撑住时，多出来的空间留在最底下，不要分摊到各行把模块往下推 */ }
  @media (min-width:860px) { main { grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:start; } .wide { grid-column:1 / -1; } }
  .title { display:flex; align-items:baseline; gap:10px; margin:0 4px 8px; }
  .title h2 { margin:0; font-size:17px; font-weight:600; letter-spacing:-.02em; }
  .title .note { font-size:12px; color:var(--ink2); margin-left:auto; }
  .card { background:var(--card); border-radius:14px; box-shadow:var(--shadow); border:.5px solid var(--hair); }

  /* 可上下拖动调节高度的模块 */
  .pane { overflow-y:auto; overscroll-behavior:contain; }
  .grip { height:14px; display:flex; align-items:center; justify-content:center; cursor:row-resize; touch-action:none; user-select:none; -webkit-user-select:none; }
  .grip::before { content:""; width:36px; height:4px; border-radius:2px; background:var(--fill2); transition:background .15s, width .15s; }
  .grip:hover::before, .grip.drag::before { background:var(--ink3); width:52px; }

  /* 字幕 */
  #subsPane { background:#1c1c1e; color:#fff; border-radius:14px; container-type:size; overflow:hidden; display:flex; }
  @media (prefers-color-scheme: dark) { #subsPane { background:#1c1c1e; border:.5px solid var(--hair); } }
  /* 每句一样大：字号固定，区域拉大（更宽 → 每句占的行少；更高 → 放得下的句子多）就多显示几句，最新一句贴底，放不下的旧句不显示 */
  #subs { width:100%; padding:12px 18px; display:flex; flex-direction:column; justify-content:flex-end; gap:10px; overflow:hidden;
          }
  .sub { flex:none; }
  .sub .zh { font-size:19px; line-height:1.35; font-weight:600; letter-spacing:-.01em; }
  .sub .en { font-size:13px; color:rgba(235,235,245,.62); line-height:1.4; margin-top:2px; }
  .tag { font-size:11px; font-weight:500; border-radius:5px; padding:1px 6px; margin-right:7px; background:rgba(255,255,255,.16); color:rgba(235,235,245,.8); vertical-align:.25em; }
  .hint { color:rgba(235,235,245,.5); font-size:14px; }

  /* 回答参考 */
  .acts { display:flex; gap:8px; padding:12px 12px 10px; position:sticky; top:0; z-index:1; background:var(--card); border-radius:14px 14px 0 0; }
  #cards { padding:0 12px 12px; }
  .item { border-radius:12px; background:var(--bg); padding:12px 14px; margin-top:10px; }
  .item:first-child { margin-top:2px; }
  .item .meta { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--ink2); margin-bottom:8px; }
  .chip { font-size:11px; font-weight:600; padding:2px 8px; border-radius:980px; }
  .item.answer .chip { background:var(--tintBlue); color:var(--blue); } .item.ask .chip { background:var(--tintIndigo); color:var(--indigo); }
  .item .q { font-size:13px; color:var(--ink2); margin-bottom:6px; }
  .item .a { font-size:16px; line-height:1.45; white-space:pre-wrap; letter-spacing:-.01em; }
  .item .zh { font-size:13px; color:var(--ink2); margin-top:6px; }
  .item .grp + .grp, .item .opt + .opt { margin-top:12px; padding-top:12px; border-top:.5px solid var(--hair); }
  .item .n { font-size:12px; font-weight:600; color:var(--indigo); margin-bottom:3px; }
  .item pre { white-space:pre-wrap; font:inherit; margin:0; }
  .empty { color:var(--ink2); padding:18px 6px; font-size:13px; line-height:1.7; }

  /* 文稿 */
  #transcript { padding:12px 16px; }
  #transcript .ln { margin:0 0 11px; }
  #transcript .ln:last-child { margin-bottom:0; }
  #transcript time { color:var(--ink3); font-size:11px; margin-right:7px; font-variant-numeric:tabular-nums; }
  #transcript .who { font-size:11px; font-weight:600; margin-right:7px; color:var(--blue); }
  #transcript .who.me { color:var(--indigo); }
  #transcript .lzh { color:var(--ink2); margin-top:1px; }
  #transcript .part { color:var(--ink3); }

  /* 设置分组 */
  .rows > .row { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:11px 16px; }
  .rows > .row + .row { border-top:.5px solid var(--hair); }
  .row .label { font-size:14px; flex:none; }
  .row .value { flex:1; min-width:180px; color:var(--ink2); font-size:13px; overflow-wrap:anywhere; text-align:right; }
  .row .sub2 { flex-basis:100%; font-size:12px; color:var(--ink2); overflow-wrap:anywhere; }
  details > summary { cursor:pointer; list-style:none; padding:11px 16px; font-size:14px; display:flex; align-items:center; }
  details > summary::-webkit-details-marker { display:none; }
  details > summary::after { content:"›"; margin-left:auto; color:var(--ink3); font-size:18px; transition:transform .15s; }
  details[open] > summary::after { transform:rotate(90deg); }
  .ctxBody { padding:0 16px 14px; }
  textarea { width:100%; min-height:110px; font:inherit; color:var(--ink); background:var(--bg); border:.5px solid var(--hair); border-radius:10px; padding:10px 12px; resize:vertical; outline:none; }
  textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px var(--tintBlue); }
</style>
</head>
<body>
<header>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">连接中…</span></div>
  <div class="seg" id="source" role="group" aria-label="声音来源">
    <button data-v="system" class="on" title="只听电脑播放的声音：看视频、听线上报告">看视频</button>
    <button data-v="both" title="电脑声音 + 麦克风：对方和你分开标注">开会</button>
    <button data-v="mic" title="只听麦克风：线下面对面">仅麦克风</button>
  </div>
  <button class="btn" id="pip" title="半透明、始终置顶的字幕窗；可拖动、可改大小，右键有更多选项">悬浮字幕</button>
  <button class="btn blue" id="toggle">开始</button>
</header>
<div id="warn"><span id="warnText"></span><button class="btn" id="warnClose">知道了</button></div>

<main>
  <section class="wide">
    <div class="pane" id="subsPane" data-default="150" data-min="96"><div id="subs"></div></div>
    <div class="grip" data-for="subsPane" title="上下拖动调节高度，双击恢复默认"></div>
  </section>

  <section>
    <div class="title"><h2>回答参考</h2></div>
    <div class="card pane" id="cardsPane" data-default="430" data-min="150">
      <div class="acts">
        <button class="btn blue big" id="answer" title="找出文稿最近 1–3 句里对方提的问题，给出针对性的回答">现在给回答</button>
        <button class="btn tintIndigo big" id="ask" title="根据对方讲的内容，给出两个可以向对方提的问题，供你二选一">现在给提问</button>
        <button class="btn plain" id="clear">清空</button>
      </div>
      <div id="cards"></div>
    </div>
    <div class="grip" data-for="cardsPane" title="上下拖动调节高度，双击恢复默认"></div>
  </section>

  <section>
    <div class="title"><h2>会议文稿</h2><span class="note" id="count"></span></div>
    <div class="card pane" id="transcript" data-default="430" data-min="150"><div class="empty">暂无文稿</div></div>
    <div class="grip" data-for="transcript" title="上下拖动调节高度，双击恢复默认"></div>
  </section>

  <section class="wide">
    <div class="title"><h2>保存</h2></div>
    <div class="card rows">
      <div class="row">
        <span class="label">文稿与纪要的保存位置</span>
        <span class="value" id="saveDir">…</span>
        <button class="btn tintBlue" id="choose">选择文件夹…</button>
        <button class="btn" id="folder">打开</button>
        <div class="sub2" id="sumStatus"></div>
      </div>
      <details class="row" style="padding:0;display:block">
        <summary>我的背景资料</summary>
        <div class="ctxBody">
          <textarea id="ctx" placeholder="例如：我是谁、这次会议的主题、我的研究设计和主要结论、想强调的要点……填了以后，回答和提问会更贴合你。只保存在本机。"></textarea>
          <div style="margin-top:8px;display:flex;align-items:center;gap:10px"><button class="btn blue" id="saveCtx">保存</button><span id="ctxMsg" style="color:var(--ink2);font-size:13px"></span></div>
        </div>
      </details>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const post = (path, body) => fetch(path, { method:'POST', headers:{'Content-Type':'application/json','X-Copilot':'1'}, body: JSON.stringify(body||{}) });
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const DEFAULT_SUM = '每次点"停止"后自动生成英文纪要，和文稿一起存到这里（每次会议一个以时间命名的子文件夹；少于 10 句不生成纪要）。';
let S = null, ctxLoaded = false, multi = false, lastTopId = 0, source = store.get('source') || 'system';
const last = { subs:'', cards:'', tx:'' };

/* ---------- 防止页面"回弹" ----------
   页面变短时（把模块拖矮、双击恢复默认、收起背景资料），如果当前滚动位置超出了新的页面长度，
   浏览器会瞬间把页面滚回去，看起来就是画面一跳。做法：变短之前先撑住页面高度（holdPage），
   之后只保留"当前滚动位置所需"的高度（relaxPage），等用户自己往上滚时再逐步放掉。 */
const mainEl = document.querySelector('main');
let held = 0;
function holdPage(){ held = Math.max(held, mainEl.offsetHeight); mainEl.style.minHeight = held + 'px'; }
function relaxPage(){
  if (!held) return;
  const need = Math.ceil(window.scrollY + window.innerHeight - mainEl.offsetTop);   // 让页面底部刚好够到窗口底部
  held = Math.min(held, need);
  if (window.scrollY <= 0 || held <= 0) { held = 0; mainEl.style.minHeight = ''; }
  else mainEl.style.minHeight = held + 'px';
}
window.addEventListener('scroll', relaxPage, { passive:true });
window.addEventListener('resize', relaxPage);

/* ---------- 三个模块的高度：拖动下方的小横条调节，自动记住；双击恢复默认 ---------- */
document.querySelectorAll('.grip').forEach(g => {
  const pane = $(g.dataset.for), key = 'h_' + g.dataset.for;
  const min = +pane.dataset.min, def = +pane.dataset.default;
  // 上限是窗口高度的九成；窗口在后台加载时高度可能读到 0，这时不设上限，避免把模块压成 0
  const apply = h => { const cap = window.innerHeight > 200 ? window.innerHeight * 0.9 : 4000; pane.style.height = Math.round(Math.max(min, Math.min(h, cap))) + 'px'; };
  apply(+store.get(key) || def);
  g.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add('drag');
    // 用"鼠标在整页里的位置"（含滚动量）算高度：只看窗口内位置的话，页面一滚就对不上
    const y0 = e.pageY, h0 = pane.offsetHeight;
    holdPage();
    const move = ev => apply(h0 + ev.pageY - y0);
    const up = () => {
      g.classList.remove('drag'); g.removeEventListener('pointermove', move);
      g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up); g.removeEventListener('lostpointercapture', up);
      store.set(key, pane.offsetHeight); relaxPage();
    };
    g.addEventListener('pointermove', move);
    g.addEventListener('pointerup', up);
    g.addEventListener('pointercancel', up);
    g.addEventListener('lostpointercapture', up);
  });
  g.addEventListener('dblclick', () => { holdPage(); apply(def); store.set(key, def); relaxPage(); });
});
// 收起"我的背景资料"也会让页面变短
document.querySelectorAll('details > summary').forEach(sm => sm.addEventListener('click', () => { holdPage(); requestAnimationFrame(relaxPage); }));

/* ---------- 声音来源（分段控件） ---------- */
function paintSource(){ document.querySelectorAll('#source button').forEach(b => b.classList.toggle('on', b.dataset.v === source)); }
document.querySelectorAll('#source button').forEach(b => b.onclick = () => {
  if (S && S.engine !== 'off') return;
  source = b.dataset.v; store.set('source', source); paintSource();
});
paintSource();

/* ---------- 渲染 ---------- */
function whoTag(label){ return multi ? `<span class="tag">${label === 'me' ? '我' : '对方'}</span>` : ''; }

// 只显示完整放得下的句子：顶上露出半句的旧句隐藏（最新一句永远显示）
function fitSubs(){
  const box = $('subs'), items = [...box.children];
  if (!items.length) return;
  const top = box.getBoundingClientRect().top + 6;
  items.forEach((e, i) => {
    const v = (i < items.length - 1 && e.getBoundingClientRect().top < top) ? 'hidden' : '';
    if (e.style.visibility !== v) e.style.visibility = v;
  });
}
new ResizeObserver(() => fitSubs()).observe(document.getElementById('subsPane'));
const SUB_MAX = 30;   // 最多取最近 30 句，实际显示几句由字幕区大小决定（放不下的被裁掉）
function subsHTML(s){
  const items = s.lines.filter(l => l.label !== 'me' || s.source === 'mic').slice(-SUB_MAX).map(l => ({zh:l.zh || '…', en:l.en, label:l.label}));
  for (const [label, p] of Object.entries(s.partials || {})) {
    if (label === 'me' && s.source !== 'mic') continue;
    if (p.text) items.push({zh:p.zh || '…', en:p.text, label});
  }
  const show = items.slice(-SUB_MAX);
  if (!show.length) {
    if (s.engine === 'listening') return '<div class="hint">正在听… 有人说英文时这里出字幕。</div>';
    if (s.engine === 'loading') return `<div class="hint">${esc(s.status_msg || '正在加载模型…')}</div>`;
    return '';
  }
  return show.map(it => `<div class="sub"><div class="zh">${whoTag(it.label)}${esc(it.zh)}</div><div class="en">${esc(it.en)}</div></div>`).join('');
}

function cardBody(c){
  if (c.kind === 'ask') {
    const m = c.text.match(/提问\s*1[:：]\s*([\s\S]*?)\n\s*中文[:：]\s*([\s\S]*?)\n\s*提问\s*2[:：]\s*([\s\S]*?)(?:\n\s*中文[:：]\s*([\s\S]*))?$/);
    if (m) return [[m[1], m[2]], [m[3], m[4]]].map(([en, zh], i) =>
      `<div class="opt"><div class="n">备选 ${i + 1}</div><div class="a">${esc(en.trim())}</div>${zh ? `<div class="zh">${esc(zh.trim())}</div>` : ''}</div>`).join('');
  } else {
    const groups = c.text.split(/\n(?=\s*问题[:：])/).map(g => g.match(/问题[:：]\s*([\s\S]*?)\n\s*回答参考[:：]\s*([\s\S]*?)(?:\n\s*中文要点[:：]\s*([\s\S]*))?$/)).filter(Boolean);
    if (groups.length) return groups.map(m => `<div class="grp"><div class="q">${esc(m[1].trim())}</div><div class="a">${esc(m[2].trim().replace(/^["“]|["”]$/g, ''))}</div>` + (m[3] ? `<div class="zh">${esc(m[3].trim())}</div>` : '') + '</div>').join('');
  }
  return `<pre>${esc(c.text || '生成中…')}</pre>`;
}

function renderCard(c){
  const kind = c.kind === 'ask' ? 'ask' : 'answer';
  return `<div class="item ${kind}"><div class="meta"><span class="chip">${kind === 'ask' ? '提问参考' : '回答参考'}</span><span>${c.time}</span><span>${c.done ? (c.secs ? c.secs + ' 秒' : '') : '生成中…'}</span></div>${cardBody(c)}</div>`;
}

function setHTML(slot, el, html){ if (last[slot] !== html) { last[slot] = html; el.innerHTML = html; return true; } return false; }
// 只在真的变了时才改。面板每 0.15 秒刷新一次；如果每次都重写按钮文字，按下和松开之间文字被换掉，
// WebKit 会判定这次点击无效（按钮要按好几下才响应）。
function setText(el, t){ if (el.textContent !== t) el.textContent = t; }
function setClass(el, c){ if (el.className !== c) el.className = c; }
function setProp(el, k, v){ if (el[k] !== v) el[k] = v; }

function render(s){
  S = s; multi = s.source === 'both';
  const on = s.engine !== 'off';
  // 工具栏
  setClass($('dot'), 'dot' + (s.engine === 'listening' ? ' live' : (s.engine === 'loading' || s.engine === 'stopping') ? ' load' : ''));
  let txt = {off:'未开始', loading: esc(s.status_msg || '正在加载模型…'), listening:'正在听', stopping:'正在收尾…'}[s.engine];
  if (s.engine === 'listening' && s.lag > 1.5) txt += ` · <span class="warnText">字幕落后约 ${Math.round(s.lag)} 秒，正在追赶</span>`;
  if (s.model_ok === false) txt += ' · <span class="warnText">回答模型未就绪（Ollama 没启动？）</span>';
  setHTML('status', $('statusText'), txt);
  setText($('toggle'), on ? '停止' : '开始');
  setClass($('toggle'), 'btn ' + (on ? 'red' : 'blue'));
  setProp($('toggle'), 'disabled', s.engine === 'stopping');
  $('source').classList.toggle('disabled', on);
  if (on && source !== s.source) { source = s.source; paintSource(); }
  setText($('pip'), pipShown(s) ? '关闭悬浮字幕' : '悬浮字幕');
  $('warn').style.display = s.warn ? 'block' : 'none';
  setText($('warnText'), s.warn || '');
  // 字幕
  setHTML('subs', $('subs'), subsHTML(s));
  fitSubs();
  // 回答参考
  setProp($('answer'), 'disabled', !!(s.busy || !s.n_lines)); setProp($('ask'), 'disabled', !!(s.busy || !s.n_lines));
  if (s.cards.length) lastTopId = s.cards[0].id;
  setHTML('cards', $('cards'), s.cards.length ? s.cards.map(renderCard).join('')
    : '<div class="empty"><b>现在给回答</b>：对方问了你问题时按，针对文稿最近 1–3 句里的问题给出可以直接说的英文。<br><b>现在给提问</b>：听完别人的发言想提问时按，给出两个备选问题供你挑一个。</div>');
  // 文稿
  const box = $('transcript');
  let h = s.lines.map(l => `<div class="ln"><time>${l.t}</time>${multi ? `<span class="who ${l.label === 'me' ? 'me' : ''}">${l.label === 'me' ? '我' : '对方'}</span>` : ''}${esc(l.en)}${l.zh ? `<div class="lzh">${esc(l.zh)}</div>` : ''}</div>`).join('');
  for (const p of Object.values(s.partials || {})) if (p.text) h += `<div class="ln part">${esc(p.text)}</div>`;
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  if (setHTML('tx', box, h || '<div class="empty">暂无文稿</div>') && stick) box.scrollTop = box.scrollHeight;
  setText($('count'), s.n_lines ? s.n_lines + ' 句' : '');
  // 保存
  setText($('saveDir'), s.save_dir || '');
  setProp($('choose'), 'disabled', on);
  setProp($('choose'), 'title', on ? '会议进行中不能更换，停止后再选' : '');
  setText($('sumStatus'), s.summary_status || DEFAULT_SUM);
  if (!ctxLoaded) { $('ctx').value = s.context || ''; ctxLoaded = true; }
}

async function tick(){
  try { render(await (await fetch('/state')).json()); }
  catch(e){ last.status = null; setText($('statusText'), '会议助手服务未运行，请重新打开"会议助手"'); setClass($('dot'), 'dot'); }
}

// 开始/停止同样防连击：引擎状态要过一会儿才变，期间再按不再触发相反的操作
let toggleUntil = 0;
$('toggle').onclick = () => {
  if (Date.now() < toggleUntil) return;
  toggleUntil = Date.now() + 1500;
  (S && S.engine !== 'off') ? post('/stop') : post('/start', { source });
};
$('answer').onclick = () => post('/answer');
$('ask').onclick = () => post('/ask');
$('clear').onclick = () => post('/clear');
$('folder').onclick = () => post('/open_folder');
$('choose').onclick = () => post('/choose_folder');
$('warnClose').onclick = () => post('/dismiss_warn');
// 悬浮字幕：按一下就切换。发给后台的是“要开”还是“要关”（不是“切换”），
// 按钮文字立刻变；字幕窗启动要半秒左右，这段时间里再按也不会被误当成第二次切换。
let pipWant = null, pipUntil = 0;
function pipShown(s){ return (pipWant !== null && Date.now() < pipUntil) ? pipWant : !!s.overlay; }
$('pip').onclick = () => {
  if (Date.now() < pipUntil) return;
  pipWant = !(S && pipShown(S));
  pipUntil = Date.now() + 1200;
  $('pip').textContent = pipWant ? '关闭悬浮字幕' : '悬浮字幕';
  post('/overlay', { on: pipWant });
};
$('saveCtx').onclick = async () => { await post('/context', { text: $('ctx').value }); $('ctxMsg').textContent = '已保存'; setTimeout(() => $('ctxMsg').textContent = '', 1500); };

setInterval(tick, 150); tick();
</script>
</body>
</html>
